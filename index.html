<!DOCTYPE html>
<html>
<head>
  <title>My Valentine 💖</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      height: 100vh;
      overflow: hidden;
    }

    h1 {
      margin-top: 120px;
      color: #b30059;
    }

    button {
      padding: 12px 25px;
      font-size: 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      margin: 15px;
    }

    #yes {
      background: #ff3366;
      color: white;
    }

    #no {
      background: white;
      color: #ff3366;
      position: absolute;
    }

    .heart {
      position: fixed;
      color: red;
      font-size: 20px;
      animation: float 4s linear infinite;
    }

    @keyframes float {
      0% { bottom: 0; opacity: 1; }
      100% { bottom: 100%; opacity: 0; }
    }
  </style>
</head>

<body>

<h1 id="text">
  Sabnur ❤️<br>
  Kya aap meri Valentine banogi?
</h1>

<button id="yes" onclick="yesClick()">Yes 💖</button>
<button id="no" onmouseover="moveNo()">No 😜</button>

<script>
  const texts = [
    "Please ek baar soch lo 🥺",
    "Dil se pooch ke dekho ❤️",
    "Main hamesha khush rakhunga 😊",
    "Chocolate, care aur pyaar free 🍫💕",
    "Ab to haan bol do na 😭"
  ];
  let count = 0;

  function yesClick() {
    document.getElementById("text").innerHTML =
      "Yayyyy 💖💖<br>Main bahut khush hoon!<br>Happy Valentine ❤️";
  }

  function moveNo() {
    const btn = document.getElementById("no");
    btn.style.left = Math.random() * 80 + "vw";
    btn.style.top = Math.random() * 80 + "vh";

    if (count < texts.length) {
      document.getElementById("text").innerHTML = texts[count];
      count++;
    }
  }

  // Hearts animation
  setInterval(() => {
    const heart = document.createElement("div");
    heart.innerHTML = "❤️";
    heart.className = "heart";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = Math.random() * 20 + 15 + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
  }, 300);
</script>

</body>
</html>
