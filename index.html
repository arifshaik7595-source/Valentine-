<!DOCTYPE html>
<html>
<head>
  <title>For Sabnur ❤️</title>
  <meta charset="UTF-8">
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 100px;
      height: 100vh;
      overflow: hidden;
    }
    h1 {
      color: #b30059;
      font-size: 28px;
    }
    button {
      padding: 15px 30px;
      font-size: 18px;
      margin: 12px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
    }
    #yes {
      background: #ff3366;
      color: white;
    }
    #no {
      background: white;
      color: #ff3366;
      position: absolute;
    }
  </style>
</head>

<body>

<h1 id="text">
  Sabnur ❤️<br>
  Kya aap meri Valentine banogi? 💌
</h1>

<button id="yes" onclick="yesClick()">Yes 💖</button>
<button id="no" onmouseover="moveNo()">No 🙈</button>

<script>
  let messages = [
    "Please ek baar soch lo 🥺",
    "Dil se pooch ke dekho ❤️",
    "Main hamesha care karunga 😊",
    "Chocolate, time aur pyaar free 🍫💕",
    "Ab to haan bol do na 😭"
  ];
  let i = 0;

  function yesClick() {
    document.body.innerHTML =
      "<h1>Yayyy! 💖💖</h1><h2>Happy Valentine Sabnur ❤️</h2>";
  }

  function moveNo() {
    const btn = document.getElementById("no");
    btn.style.left = Math.random() * 80 + "vw";
    btn.style.top = Math.random() * 80 + "vh";

    if (i < messages.length) {
      document.getElementById("text").innerHTML = messages[i];
      i++;
    }
  }
</script>

</body>
</html>
